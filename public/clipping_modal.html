
      <!-- Demo Modal -->
      <div id="demoModal" class="demo-modal-overlay" style="display: none;">
          <div class="demo-modal-container">
              <button class="demo-modal-close" onclick="closeDemoModal()">&times;</button>
              <h3 class="demo-modal-title">Solicitar Demo</h3>
              <p class="demo-modal-subtitle">Completá tus datos y nos pondremos en contacto.</p>
              <form id="demoForm" onsubmit="submitDemoForm(event)">
                  <div class="demo-form-group">
                      <label for="demoName">Nombre completo</label>
                      <input type="text" id="demoName" required placeholder="Ej: Juan Pérez">
                  </div>
                  <div class="demo-form-group">
                      <label for="demoEmail">Correo electrónico</label>
                      <input type="email" id="demoEmail" required placeholder="tu@empresa.com">
                  </div>
                  <div class="demo-form-group demo-captcha-group">
                      <label for="demoCaptcha" id="demoCaptchaLabel">¿Cuánto es X + Y?</label>
                      <input type="number" id="demoCaptcha" required placeholder="Respuesta">
                  </div>
                  <button type="submit" class="catalog-v2-btn-primary" id="demoSubmitBtn" style="width: 100%; margin-top: 10px;">Enviar Solicitud</button>
                  <p id="demoStatusMessage" class="demo-status-message"></p>
              </form>
          </div>
      </div>
      <script src="/catalog-modal.js"></script>
